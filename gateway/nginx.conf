events {}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location /chatrooms {
            proxy_pass http://chatroom-api:8082;
        }

        location /users {
            proxy_pass http://user-service:3000;
        }

        location /auth {
            proxy_pass http://user-service:3000;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
