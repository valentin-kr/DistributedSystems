services:
  chatroom-api:
    build: ./chatroom-service
    ports:
      - "8082:8082"
    environment:
      CHATROOM_SERVICE_PORT: 8082
      CHATROOM_DB_URL: jdbc:postgresql://chatroom-db:5432/chatroom-db
      CHATROOM_DB_USERNAME: chatroom
      CHATROOM_DB_PASSWORD: chatroom
      MEDIA_STORAGE_DIR: /app/media-storage
    volumes:
      - chatroom-media:/app/media-storage
    depends_on:
      chatroom-db:
        condition: service_healthy

  chatroom-db:
    image: postgres:18
    environment:
      POSTGRES_DB: chatroom-db
      POSTGRES_USER: chatroom
      POSTGRES_PASSWORD: chatroom
    ports:
      - "5432:5432"
    volumes:
      - chatroom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatroom -d chatroom-db"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build: ./nodeJS_Service
    ports:
      - "3000:3000"
    environment:
      PGHOST: user-db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: users
    depends_on:
      user-db:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatroom-api
      - user-service

volumes:
  user-db-data:
  chatroom-db-data:
  chatroom-media:
