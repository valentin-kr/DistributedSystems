services:
  chatroom-api:
    build: ./chatroomAPI
    ports:
      - "8081:8081"
    environment:
      MEDIA_STORAGE_DIR: /app/media-storage
    volumes:
      - chatroom-media:/app/media-storage

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build: ./nodeJS_Service
    ports:
      - "3000:3000"
    environment:
      PGHOST: user-db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: users
    depends_on:
      user-db:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatroom-api
      - user-service

volumes:
  user-db-data:
  chatroom-media:
