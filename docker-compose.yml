services:
  chatroom-api:
    build: ./chatroomAPI
    ports:
      - "8081:8081"

  user-service:
    build: ./nodeJS_Service
    ports:
      - "3000:3000"

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatroom-api
      - user-service
