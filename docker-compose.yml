services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  chatroom-api:
    build: ./chatroom-service
    ports:
      - "8082:8082"
    environment:
      CHATROOM_SERVICE_PORT: 8082
      CHATROOM_DB_URL: jdbc:postgresql://chatroom-db:5432/chatroom-db
      CHATROOM_DB_USERNAME: chatroom
      CHATROOM_DB_PASSWORD: chatroom
      MEDIA_STORAGE_DIR: /app/media-storage
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-}
      ZITADEL_JWKS_URI: ${ZITADEL_JWKS_URI:-}
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE:-}
      KAFKA_BROKER: kafka:9092
      CHATROOM_KAFKA_ENABLED: "true"
    volumes:
      - chatroom-media:/app/media-storage
    depends_on:
      chatroom-db:
        condition: service_healthy
      kafka:
        condition: service_started

  chatroom-db:
    image: postgres:18
    environment:
      POSTGRES_DB: chatroom-db
      POSTGRES_USER: chatroom
      POSTGRES_PASSWORD: chatroom
    ports:
      - "5432:5432"
    volumes:
      - chatroom-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatroom -d chatroom-db"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build: ./nodeJS_Service
    ports:
      - "3000:3000"
    environment:
      PGHOST: user-db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: users
      KAFKA_BROKER: kafka:9092
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-}
      ZITADEL_JWKS_URI: ${ZITADEL_JWKS_URI:-}
      ZITADEL_USERINFO_URI: ${ZITADEL_USERINFO_URI:-}
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE:-}
    depends_on:
      user-db:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend-service:
    build: ./frontend-service
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_PROXY_TARGET: http://gateway:80
      VITE_ZITADEL_ISSUER: ${ZITADEL_ISSUER:-}
      VITE_ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      VITE_ZITADEL_REDIRECT_URI: ${VITE_ZITADEL_REDIRECT_URI:-http://localhost:5173/oidc/callback}
      VITE_ZITADEL_POST_LOGOUT_REDIRECT_URI: ${VITE_ZITADEL_POST_LOGOUT_REDIRECT_URI:-http://localhost:5173}
      VITE_ZITADEL_SCOPES: ${VITE_ZITADEL_SCOPES:-openid profile email offline_access}
    volumes:
      - ./frontend-service:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - gateway

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatroom-api
      - user-service

volumes:
  user-db-data:
  chatroom-db-data:
  chatroom-media:
  frontend-node-modules:
