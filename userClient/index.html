<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TimeChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TimeChat</h1>
    <div id="user-bar">
      <div id="logged-out-view">
        <form id="request-code-form">
          <input id="phone-number" type="tel" placeholder="Phone number" required />
          <button type="submit">Send code</button>
        </form>
        <form id="verify-form" hidden>
          <input id="verify-code" placeholder="Verification code" required />
          <input id="signup-username" placeholder="Username (first time only)" />
          <button type="submit">Verify &amp; log in</button>
        </form>
        <p id="simulated-sms-note" class="sms-note"></p>
        <p id="auth-error" class="error"></p>
      </div>
      <div id="logged-in-view" hidden>
        <span id="logged-in-as"></span>
        <button id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main id="app-main" hidden>
    <aside id="room-list-panel">
      <h2>Chatrooms</h2>
      <form id="new-room-form">
        <input id="room-name" placeholder="Room name" required />
        <input id="room-description" placeholder="Description" />
        <label>
          Expires in (hours)
          <input id="room-expiry" type="number" min="1" value="24" required />
        </label>
        <button type="submit">Create room</button>
      </form>

      <form id="join-room-form">
        <input id="join-code" placeholder="Join code" required />
        <button type="submit">Join room</button>
      </form>
      <p id="join-error" class="error"></p>

      <ul id="room-list"></ul>
    </aside>

    <section id="room-detail">
      <p id="no-room-selected">Select or create a chatroom to get started.</p>

      <div id="room-content" hidden>
        <h2 id="room-title"></h2>
        <p id="room-description-text"></p>
        <p id="room-status"></p>
        <p id="room-join-code"></p>

        <div class="panel">
          <h3>Members</h3>
          <ul id="member-list"></ul>
          <form id="add-member-form">
            <select id="add-member-select"></select>
            <button type="submit">Add member</button>
          </form>
        </div>

        <div class="panel">
          <h3>Messages</h3>
          <ul id="message-list"></ul>
          <form id="send-message-form">
            <input id="message-text" placeholder="Type a message" required />
            <button type="submit">Send</button>
          </form>
          <p id="message-error" class="error"></p>
        </div>

        <div class="panel">
          <h3>Media</h3>
          <ul id="media-list"></ul>
          <form id="upload-media-form">
            <input id="media-file" type="file" required />
            <button type="submit">Upload</button>
          </form>
          <p id="media-error" class="error"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
