spring.application.name=chatroomAPI
server.port=${CHATROOM_SERVICE_PORT:8082}
spring.datasource.url=${CHATROOM_DB_URL:jdbc:postgresql://localhost:5432/chatroom-db}
spring.datasource.username=${CHATROOM_DB_USERNAME:chatroom}
spring.datasource.password=${CHATROOM_DB_PASSWORD:chatroom}
spring.jpa.hibernate.ddl-auto=update
