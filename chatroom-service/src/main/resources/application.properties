spring.application.name=chatroomAPI
server.port=${CHATROOM_SERVICE_PORT:8082}
spring.datasource.url=${CHATROOM_DB_URL:jdbc:postgresql://localhost:5432/chatroom-db}
spring.datasource.username=${CHATROOM_DB_USERNAME:chatroom}
spring.datasource.password=${CHATROOM_DB_PASSWORD:chatroom}
spring.jpa.hibernate.ddl-auto=update
chatroom.retention-days=${CHATROOM_RETENTION_DAYS:7}
auth.required=${AUTH_REQUIRED:false}
auth.issuer=${ZITADEL_ISSUER:}
auth.jwk-set-uri=${ZITADEL_JWKS_URI:}
auth.audience=${ZITADEL_AUDIENCE:}
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}
chatroom.kafka.enabled=${CHATROOM_KAFKA_ENABLED:false}
chatroom.kafka.message-topic=${CHATROOM_MESSAGE_TOPIC:message-events}
